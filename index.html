<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вечный секундомер</title>
    <meta
      name="description"
      content="Личный вечный секундомер, который продолжает считать время после старта."
    >
    <link rel="stylesheet" href="styles.css?v=6">
  </head>
  <body>
    <main class="app" aria-live="polite">
      <section class="stopwatch" aria-label="Вечный секундомер">
        <div class="watch-case">
          <div class="crown" aria-hidden="true"></div>
          <div class="dial">
            <div class="elapsed-display" aria-label="Главный отсчет">
              <div class="elapsed-item">
                <span id="mainMinutes">0</span>
                <small>минут</small>
              </div>
              <div class="elapsed-item">
                <span id="mainHours">0</span>
                <small>часов</small>
              </div>
            </div>
            <p class="since" id="sinceText">15:15 28.05.2026</p>
          </div>
        </div>

      </section>
    </main>

    <script src="script.js?v=12"></script>
  </body>
</html>
